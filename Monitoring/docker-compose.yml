version: '3.8'

services:

app:
build: .
container_name: myapp
ports:
- "8501:8501"
- "8000:8000"
restart: always

prometheus:
image: prom/prometheus
container_name: prometheus
volumes:
- ./prometheus.yml:/etc/prometheus/prometheus.yml
ports:
- "9090:9090"
restart: always

grafana:
image: grafana/grafana
container_name: grafana
volumes:
- grafana_data:/var/lib/grafana
ports:
- "3000:3000"
restart: always

volumes:
grafana_data:
