global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "streamlit-app"
    static_configs:
      - targets: ["app:8501"]

  - job_name: "metrics"
    static_configs:
      - targets: ["metrics:8000"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]